
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: flipkart-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/letslearn207/flipkart-gitops.git
    path: child-apps
    targetRevision: HEAD

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
