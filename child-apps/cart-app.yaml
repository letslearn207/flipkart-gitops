apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cart
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"


spec:
  project: default

  source:
    repoURL: https://github.com/letslearn207/flipkart-gitops.git
    path: apps/cart
    targetRevision: HEAD

  destination:
    server: https://kubernetes.default.svc
    namespace: cart

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true
