
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: product
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/letslearn207/flipkart-gitops.git
    path: apps/product
    targetRevision: HEAD

  destination:
    server: https://kubernetes.default.svc
    namespace: product

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true
